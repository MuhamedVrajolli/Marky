appId: local.marky.editor
productName: Marky
copyright: Copyright © 2026 Muhamed Vrajolli

directories:
  output: dist
  buildResources: build

# The app is bundled into out/ by electron-vite (including Vditor's assets). Runtime
# dependencies (electron-updater) are added from node_modules by electron-builder.
files:
  - out/**
  - package.json
  - '!out/.tsc/**'
  - '!**/*.map'

npmRebuild: false

# Where installed copies look for updates (src/main/updater.ts). electron-builder only writes the
# update files (latest.yml, app-update.yml); CI publishes the releases (.github/workflows/ci.yml).
publish:
  provider: github
  owner: MuhamedVrajolli
  repo: Marky

# Electron features Marky doesn't use, switched off in Marky.exe so it can't be misused as a
# general-purpose Node.js runtime, and so a modified app.asar won't load.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  # Generated from build/icon.svg with `npm run icon`.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Marky
  artifactName: ${productName}-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

# Registers Marky as an editor for markdown files ("Open with" list; Windows asks once
# before making it the default).
fileAssociations:
  - ext: [md, markdown]
    name: Markdown
    description: Markdown document
    role: Editor
