appId: local.marky.editor
productName: Marky
copyright: MIT License

directories:
  output: dist
  buildResources: build

# Everything the app needs is bundled into out/ by electron-vite (including Vditor's assets).
files:
  - out/**
  - package.json
  - '!out/.tsc/**'
  - '!**/*.map'

npmRebuild: false

win:
  # Generated from build/icon.svg with `npm run icon`.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Marky
  artifactName: ${productName}-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

# Registers Marky as an editor for markdown files ("Open with" list; Windows asks once
# before making it the default).
fileAssociations:
  - ext: [md, markdown]
    name: Markdown
    description: Markdown document
    role: Editor
